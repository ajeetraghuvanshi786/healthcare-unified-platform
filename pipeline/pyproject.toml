[project]
name = "healthcare-data-pipeline"
version = "0.1.0"
description = "Reliable healthcare batch ETL and ELT platform"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "polars>=1.0,<2.0",
    "python-dateutil>=2.9,<3.0",
    "structlog>=24.0,<26.0",
    "tenacity>=8.5,<10.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "cryptography>=43.0,<48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "e2e: local database-backed end-to-end tests that require explicit opt-in",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
